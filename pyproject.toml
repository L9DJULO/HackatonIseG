[project]
name = "iseg-frugal"
version = "0.1.0"
description = "Hackathon SCIA 2026 - iSeg-2017 segmentation frugale : features non apprises + classifieur minuscule"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.2", "scipy==1.18.1", "scikit-learn==1.9.0", "nibabel==5.4.2",
  "matplotlib==3.11.1", "PyYAML==6.0.3", "higra==0.6.13",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
