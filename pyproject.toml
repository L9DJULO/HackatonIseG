[project]
name = "iseg-frugal"
version = "0.1.0"
description = "Hackathon SCIA 2026 - iSeg-2017 segmentation frugale : features non apprises + classifieur minuscule"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "nibabel>=5.0",
  "matplotlib>=3.8", "pyyaml>=6.0", "higra>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
