# Ablation de la quantification : niveaux linéaires (percentiles 1-99) au lieu des rangs.
run_name: logreg_ABCD_p3_linear
seed: 0
features:
  - name: intensity
  - name: gaussian
  - name: spatial
  - name: morpho
    quantization: linear
model:
  name: logreg
  config: {C: 1.0, max_iter: 300}
sampling:
  n_per_class: 5000
  boundary_frac: 0.0
  prior_correction: true
