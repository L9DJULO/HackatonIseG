# A+B+C+D avec 50 % d'exemples de frontière (T3).
run_name: logreg_ABCD_boundary
seed: 0
features:
  - name: intensity
  - name: gaussian
  - name: spatial
  - name: morpho
model:
  name: logreg
  config: {C: 1.0, max_iter: 300}
sampling:
  n_per_class: 5000
  boundary_frac: 0.5
  prior_correction: true
