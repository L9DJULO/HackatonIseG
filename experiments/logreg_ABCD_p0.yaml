# Palier 0 : max-tree + min-tree, attributs du nœud propre seulement (pas de remontée).
run_name: logreg_ABCD_p0
seed: 0
features:
  - name: intensity
  - name: gaussian
  - name: spatial
  - name: morpho
    tree: minmax
    leaf_attributes: true
    area_profile: []
    grain_filters: []
model:
  name: logreg
  config: {C: 1.0, max_iter: 300}
sampling:
  n_per_class: 5000
  boundary_frac: 0.0
  prior_correction: true
