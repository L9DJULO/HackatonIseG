# Ablation : quantification sur 64 niveaux au lieu de 256, tout le reste identique au palier 2.
run_name: logreg_ABCD_p2_l64
seed: 0
features:
  - name: intensity
  - name: gaussian
  - name: spatial
  - name: morpho
    levels: 64
model:
  name: logreg
  config: {C: 1.0, max_iter: 300}
sampling:
  n_per_class: 5000
  boundary_frac: 0.0
  prior_correction: true
