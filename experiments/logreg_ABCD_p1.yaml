# Palier 1 : max-tree + min-tree + remontée de branche (4 échelles d'aire).
run_name: logreg_ABCD_p1
seed: 0
features:
  - name: intensity
  - name: gaussian
  - name: spatial
  - name: morpho
    tree: minmax
    grain_filters: []
model:
  name: logreg
  config: {C: 1.0, max_iter: 300}
sampling:
  n_per_class: 5000
  boundary_frac: 0.0
  prior_correction: true
