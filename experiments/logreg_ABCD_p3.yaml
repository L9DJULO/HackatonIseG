# Palier 3 : palier 2 + filtres de grain. Mesure l'apport des filtres de grain seuls.
run_name: logreg_ABCD_p3
seed: 0
features:
  - name: intensity
  - name: gaussian
  - name: spatial
  - name: morpho
    grain_filters: [50, 500, 5000]
model:
  name: logreg
  config: {C: 1.0, max_iter: 300}
sampling:
  n_per_class: 5000
  boundary_frac: 0.0
  prior_correction: true
